# =====================================================================
#  application.conf - configuration externalisée du projet (Question 7.1)
#
#  - Toute clé absente est remplacée par une valeur par défaut définie
#    dans le code (ConfigLoader), avec un avertissement dans la console.
#  - Toute clé peut être surchargée sans modifier ce fichier :
#      -Dapp.spark.shuffle.partitions=16          (une seule clé)
#      -Dconfig.file=/chemin/vers/cluster.conf    (fichier complet)
# =====================================================================
app {
  name = "EcommerceAnalytics"

  # -------------------------------------------------------------------
  # Paramètres Spark
  # -------------------------------------------------------------------
  spark {
    # Ignoré si spark-submit fournit --master
    master = "local[*]"
    # 200 par défaut dans Spark : trop pour ~138 000 lignes en local
    shuffle.partitions = 8
    # Niveau de log appliqué après le démarrage (ALL, DEBUG, INFO, WARN, ERROR, OFF)
    log-level = "WARN"

    # Paramètres Spark supplémentaires, transmis tels quels à la SparkSession
    conf {
      # Une date impossible donne null avec to_timestamp au lieu d'une erreur
      "spark.sql.legacy.timeParserPolicy" = "CORRECTED"
    }
  }

  # -------------------------------------------------------------------
  # Optimisations (Partie 5)
  # -------------------------------------------------------------------
  optimization {
    # Interrupteur général pour la mesure avant / après (Question 5.3) :
    # -Dapp.optimization.enabled=false
    enabled          = true
    enable-cache     = true
    enable-broadcast = true
  }

  # -------------------------------------------------------------------
  # Chemins d'entrée et de sortie
  # -------------------------------------------------------------------
  data {
    # Chemins relatifs à la racine du projet (répertoire de lancement de sbt run).
    # Les données restent sur le disque : Spark ne sait pas lire un fichier
    # embarqué à l'intérieur du JAR. Sur un cluster : chemins hdfs:// ou s3a://.
    input {
      transactions = "src/main/resources/data/transactions.csv"
      users        = "src/main/resources/data/users.json"
      products     = "src/main/resources/data/products.parquet"
      merchants    = "src/main/resources/data/merchants.csv"
    }
    output {
      path = "output/"
    }
  }

  # -------------------------------------------------------------------
  # Seuils de validation (Partie 2) - bornes incluses
  # -------------------------------------------------------------------
  validation {
    transaction { min-amount = 0.0, timestamp-length = 14 }
    user        { min-age = 16, max-age = 100, min-income = 0.0 }
    product     { min-price = 0.0, min-rating = 1.0, max-rating = 5.0 }
    merchant    { min-commission = 0.0, max-commission = 1.0 }
  }

  # -------------------------------------------------------------------
  # Règles métier (Parties 3 et 4)
  # -------------------------------------------------------------------
  rules {
    # 3.3 : fenêtre glissante (jours) et seuil "utilisateur actif" (jours distincts)
    window-days            = 7
    active-user-min-days   = 5

    # 3.4 (bonus) : transaction suspecte si au moins min-signals conditions sont vraies
    suspicious {
      amount-over-average-pct = 300
      max-delay-seconds       = 300
      payment-method          = "CRYPTO"
      min-signals             = 2
    }
  }

  analytics {
    retention-period-months = 3   # 4.2 : cohorte ayant la meilleure rétention à N mois
    rfm-quantiles           = 5   # 4.3 : scores de 1 à 5 (quintiles)
    top-products            = 10  # 4.4 : taille du top produits
  }
}
